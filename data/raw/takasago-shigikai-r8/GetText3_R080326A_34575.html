<FONT class="TEXT2">
　<BR>
　ご異議なしと認めます。
<BR>
　したがって、本案、委員長報告どおり原案可決いたしました。
<BR>
　日程第１５、高予第１０号、令和８年度高砂市一般会計予算を議題といたします。
<BR>
　まず、第１条、第２項、第１表、歳入歳出予算の歳出よりご審議願うことといたします。
<BR>
　第１款議会費、第２款総務費、第３款民生費、第４款衛生費、第５款労働費、第６款農林水産業費、第７款商工費を議題といたします。
<BR>
　各委員長の報告を求めます。
<BR>
　４番、岩見議員。
<BR>
<BR>
