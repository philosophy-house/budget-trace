　起立多数。よって、議案第２０号については委員長報告どおり決しました。
<BR>
　お諮りいたします。議案第２１号及び議案第２２号については、質疑討論を省略し直ちに採決に入りたいと思いますが、これにご異議ございませんか。（「異議なし」の声あり）　ご異議なしと認めます。よって、ただいまのとおり決しました。
<BR>
　採決の方法は起立により行います。
<BR>
　議案第２１号及び議案第２２号について、委員長報告どおり決することに賛成の方の起立を求めます。
<BR>
